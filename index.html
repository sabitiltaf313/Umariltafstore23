<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ایڈمن پینل - عمر الطاف اسٹور</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:#fff;padding:15px}
h1{text-align:center;margin:15px 0}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.tabs button{padding:12px 20px;border:none;border-radius:25px;cursor:pointer;font-weight:bold}
.tabs .active{background:#25D366;color:#fff}
.tabs .inactive{background:#334155;color:#fff}
.box{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:12px}
.box img{width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.box h3{font-size:15px}
.box p{font-size:13px;opacity:.8;margin:4px 0}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.approve{background:#22c55e;color:#fff}
.reject{background:#ef4444;color:#fff}
.call{background:#000;color:#fff;padding:8px 12px;border-radius:20px;text-decoration:none;display:inline-block;margin-top:6px;font-size:12px}
</style>
</head>
<body>

<h1>عمر الطاف - ایڈمن پینل</h1>

<div class="tabs">
<button id="tab1" class="active" onclick="showTab('orders')">آرڈرز</button>
<button id="tab2" class="inactive" onclick="showTab('products')">پروڈکٹس (منظوری)</button>
</div>

<div id="ordersDiv"></div>
